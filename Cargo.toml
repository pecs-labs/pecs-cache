[package]
name = "pecs-cache"
version = "0.1.0"
edition = "2021"
authors = ["pecs-labs"]
description = "Declarative, pluggable multi-backend cache framework with scope isolation and macro aspects for Rust"
repository = "https://github.com/pecs-labs/pecs-cache"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cache", "redis", "memory", "macro", "declarative"]
categories = ["caching", "asynchronous"]

[features]
default = ["memory", "macros"]
memory = []
macros = ["dep:pecs-cache-macros"]
redis = ["dep:redis"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync", "time", "rt"] }
tracing = "0.1"

# Macros
pecs-cache-macros = { version = "0.1.0", path = "pecs-cache-macros", optional = true }

# Redis backend (optional)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = "0.3"
