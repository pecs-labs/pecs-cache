[package]
name = "pecs-cache-macros"
version = "0.1.0"
edition = "2021"
description = "Declarative caching procedural macros for pecs-cache"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pecs-labs/pecs-cache"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
